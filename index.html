<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アマドの餃子</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1a1208;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Zen Maru Gothic',sans-serif;}

  .page{width:100%;max-width:480px;position:relative;}

  .illust{width:100%;position:relative;}
  .illust img{width:100%;display:block;}

  /* 餃子エリアのボタン */
  .btn-wrap{position:absolute;bottom:10%;left:5%;width:42%;}
  .btn-gyoza{display:block;width:100%;background:rgba(255,255,255,0.93);border:2.5px solid #c0392b;border-radius:24px;padding:10px 12px;text-align:center;text-decoration:none;font-family:'Zen Maru Gothic',sans-serif;font-size:13px;font-weight:700;color:#c0392b;box-shadow:0 4px 20px rgba(192,57,43,0.4);animation:pulse 2s ease-in-out infinite;line-height:1.4;}
  .btn-gyoza:hover{background:#c0392b;color:#fff;}
  @keyframes pulse{0%,100%{box-shadow:0 4px 20px rgba(192,57,43,.4);}50%{box-shadow:0 4px 30px rgba(192,57,43,.7);}}
  .btn-emoji{font-size:18px;display:block;}

  /* 使い方リンク */
  .howto-link{display:block;text-align:center;margin-top:16px;color:rgba(255,255,255,0.5);font-size:12px;text-decoration:none;letter-spacing:0.1em;}
  .howto-link:hover{color:rgba(255,255,255,0.8);}

  /* フォールバック */
  .fallback{background:linear-gradient(135deg,#b8d4e8,#e8c4a0 40%,#c8b090);width:100%;padding-top:133%;position:relative;border-radius:8px;}
  .fallback-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
  .fallback-title{font-family:'Kaisei Decol',serif;font-size:32px;color:#5a3a1a;}
</style>
</head>
<body>
<div class="page">
  <div class="illust" id="illustArea">
    <img src="amado.PNG" alt="アマドの餃子" onerror="showFallback()">
    <div class="btn-wrap">
      <a href="gyoza-log.html" class="btn-gyoza">
        <span class="btn-emoji">🥟</span>
        餃子ログを開く
      </a>
    </div>
  </div>
  <a href="how-to.html" class="howto-link">📖 使い方を見る</a>
</div>

<script>
function showFallback(){
  document.getElementById('illustArea').innerHTML=`
    <div class="fallback">
      <div class="fallback-inner">
        <span style="font-size:64px">🐶</span>
        <span class="fallback-title">アマドの餃子</span>
        <span style="font-size:48px">🥟</span>
      </div>
    </div>
    <div class="btn-wrap">
      <a href="gyoza-log.html" class="btn-gyoza">
        <span class="btn-emoji">🥟</span>
        餃子ログを開く
      </a>
    </div>
  `;
}
</script>
</body>
</html>
